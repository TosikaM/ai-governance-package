name: 'Enterprise AI Governance Gate'
description: 'Automated Policy-as-Code compliance verification, copyleft license scanner, and safety gate for AI projects.'
author: 'Enterprise AI Governance Core Team'

inputs:
  action:
    description: 'Governance action to perform: "audit", "auto-setup", "check-pr", or "inspect"'
    required: false
    default: 'audit'
  target-dir:
    description: 'Path to target AI project directory to evaluate'
    required: false
    default: '.'
  fail-on-violation:
    description: 'Whether to halt the CI/CD job if compliance checks fail'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Governance Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml jsonschema

    - name: Execute Enterprise AI Governance Gate
      shell: bash
      run: |
        python "${{ github.action_path }}/agents/governance_agent.py" "${{ inputs.action }}" "${{ inputs.target-dir }}"
